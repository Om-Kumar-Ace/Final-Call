<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro Auction Live</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;600;700&family=Rajdhani:wght@500;700&family=Inter:wght@400;600;700;900&display=swap"
        rel="stylesheet">

    <style>
        /* ===== FONTS ===== */
        .font-hero {
            font-family: 'Teko', sans-serif;
        }

        .font-tech {
            font-family: 'Rajdhani', sans-serif;
        }

        .font-ui {
            font-family: 'Inter', sans-serif;
        }

        /* ===== SCROLL ===== */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(34, 211, 238, 0.7) rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(34, 211, 238, 0.55);
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(34, 211, 238, 1);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes scroll-text {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        .animate-scroll {
            animation: scroll-text 36s linear infinite;
        }

        @keyframes slam-in {
            0% {
                transform: scale(5);
                opacity: 0;
                filter: blur(20px);
            }

            55% {
                transform: scale(0.95);
                opacity: 1;
                filter: blur(0px);
            }

            75% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-slam {
            animation: slam-in 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes ray-rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .rays {
            animation: ray-rotate 18s linear infinite;
        }

        @keyframes spotlight-pulse {

            0%,
            100% {
                opacity: 0.35;
                transform: scale(1);
            }

            50% {
                opacity: 0.75;
                transform: scale(1.08);
            }
        }

        .spotlight {
            animation: spotlight-pulse 4s ease-in-out infinite;
        }

        /* ===== GLASS ===== */
        .glass-dark {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
        }

        .glass-light {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
        }

        .btn-main {
            background: linear-gradient(90deg, #06b6d4, #2563eb);
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.25);
        }

        /* ===== TEAM THEMES (12) ===== */
        .team-0 {
            border-color: rgba(34, 211, 238, 0.25);
        }

        .team-0 .t-text {
            color: #22d3ee;
        }

        .team-1 {
            border-color: rgba(251, 113, 133, 0.25);
        }

        .team-1 .t-text {
            color: #fb7185;
        }

        .team-2 {
            border-color: rgba(52, 211, 153, 0.25);
        }

        .team-2 .t-text {
            color: #34d399;
        }

        .team-3 {
            border-color: rgba(251, 191, 36, 0.25);
        }

        .team-3 .t-text {
            color: #fbbf24;
        }

        .team-4 {
            border-color: rgba(167, 139, 250, 0.25);
        }

        .team-4 .t-text {
            color: #a78bfa;
        }

        .team-5 {
            border-color: rgba(244, 114, 182, 0.25);
        }

        .team-5 .t-text {
            color: #f472b6;
        }

        .team-6 {
            border-color: rgba(96, 165, 250, 0.25);
        }

        .team-6 .t-text {
            color: #60a5fa;
        }

        .team-7 {
            border-color: rgba(163, 230, 53, 0.25);
        }

        .team-7 .t-text {
            color: #a3e635;
        }

        .team-8 {
            border-color: rgba(249, 115, 22, 0.25);
        }

        .team-8 .t-text {
            color: #fb923c;
        }

        .team-9 {
            border-color: rgba(45, 212, 191, 0.25);
        }

        .team-9 .t-text {
            color: #2dd4bf;
        }

        .team-10 {
            border-color: rgba(148, 163, 184, 0.25);
        }

        .team-10 .t-text {
            color: #cbd5e1;
        }

        .team-11 {
            border-color: rgba(129, 140, 248, 0.25);
        }

        .team-11 .t-text {
            color: #818cf8;
        }
    </style>
</head>

<body class="font-ui selection:bg-cyan-500/30">
    <div id="root"></div>

    {% verbatim %}
    <script type="text/babel">
        const { useEffect, useMemo, useRef, useState } = React;

        // ===== ICONS =====
        const Icon = ({ children, c }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                className={c}>
                {children}
            </svg>
        );

        const Trophy = ({ c }) => <Icon c={c}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z" /></Icon>;
        const Users = ({ c }) => <Icon c={c}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></Icon>;
        const Lock = ({ c }) => <Icon c={c}><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></Icon>;
        const Sun = ({ c }) => <Icon c={c}><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></Icon>;
        const Moon = ({ c }) => <Icon c={c}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></Icon>;
        const Share2 = ({ c }) => <Icon c={c}><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><line x1="8.59" y1="13.51" x2="15.42" y2="17.49" /><line x1="15.41" y1="6.51" x2="8.59" y2="10.49" /></Icon>;
        const Download = ({ c }) => <Icon c={c}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></Icon>;
        const X = ({ c }) => <Icon c={c}><path d="M18 6 6 18M6 6l12 12" /></Icon>;
        const ChevronRight = ({ c }) => <Icon c={c}><path d="m9 18 6-6-6-6" /></Icon>;
        const Gavel = ({ c }) => <Icon c={c}><path d="m14 13-7.5 7.5c-.5.5-1.5.5-2 0L2 18c-.5-.5-.5-1.5 0-2L9.5 8.5M17.5 12.5l-5.5-5.5M10 2l11 11" /></Icon>;

        // ===== CSRF =====
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function App() {
            const [data, setData] = useState(null);

            // roles
            const [isAdmin, setIsAdmin] = useState(false);
            const [isViewerMode, setIsViewerMode] = useState(false);

            // theme
            const [theme, setTheme] = useState("dark");
            const isDark = theme === "dark";

            // modals
            const [showPin, setShowPin] = useState(false);
            const [pinInput, setPinInput] = useState("");

            const [showShare, setShowShare] = useState(false);
            const [selectedTeam, setSelectedTeam] = useState(null);

            // bidding
            const [customBid, setCustomBid] = useState("");

            const [showCheat, setShowCheat] = useState(false);
            const [search, setSearch] = useState("");


            // team leadership edit
            const [captainDraft, setCaptainDraft] = useState("");
            const [viceDraft, setViceDraft] = useState("");

            // animations
            const [animStage, setAnimStage] = useState("idle");
            const [scrambleText, setScrambleText] = useState("INITIALIZING...");
            const [tempWinner, setTempWinner] = useState(null);

            const prevPlayerId = useRef(null);


            const togglePriority = async (id) => {
                try {
                    // Optimistic UI update
                    const updated = (data.all_unsold_players || []).map(p =>
                        p.id === id ? { ...p, priority_score: p.priority_score > 0 ? 0 : 1 } : p
                    );
                    setData({ ...data, all_unsold_players: updated });

                    await fetch("/api/toggle-priority/", {
                        method: "POST",
                        headers: headersJSON,
                        body: JSON.stringify({ player_id: id })
                    });

                } catch (e) {
                    console.error("Priority Toggle Error", e);
                }
            };

            // viewer mode
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get("role") === "viewer") {
                    setIsViewerMode(true);
                    setIsAdmin(false);
                }
            }, []);

            // theme persist
            useEffect(() => {
                const saved = localStorage.getItem("auction_theme");
                if (saved === "light" || saved === "dark") setTheme(saved);
            }, []);
            useEffect(() => {
                localStorage.setItem("auction_theme", theme);
            }, [theme]);

            const headersJSON = useMemo(() => ({
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie("csrftoken"),
            }), []);

            const glass = isDark ? "glass-dark" : "glass-light";
            const pageBG = isDark
                ? "bg-[#020617] bg-[radial-gradient(circle_at_50%_-20%,_#1e293b_0%,_#020617_80%)] text-slate-100"
                : "bg-slate-50 text-slate-900";

            const getImg = (p) => {
                if (!p) return "";
                if (p.image && p.image.length > 5) return p.image;
                return `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(p.name || "Player")}`;
            };

            // scramble spin
            useEffect(() => {
                if (animStage !== "spinning") return;
                const words = ["SEARCHING", "MATCHING", "LOCKED", "TARGETING", "ANALYZING", "SCANNING"];
                const interval = setInterval(() => {
                    setScrambleText(words[Math.floor(Math.random() * words.length)] + "...");
                }, 90);
                return () => clearInterval(interval);
            }, [animStage]);

            // polling
            const fetchData = async () => {
                try {
                    const res = await fetch("/api/state/");
                    const d = await res.json();
                    if (d.error) return;

                    setData(d);

                    // reveal sync
                    if (d.current_player && d.current_player.id !== prevPlayerId.current) {
                        if (prevPlayerId.current !== null) {
                            setTempWinner(d.current_player);
                            setAnimStage("revealed");
                        }
                        prevPlayerId.current = d.current_player.id;
                    } else if (!d.current_player) {
                        prevPlayerId.current = null;
                        if (animStage !== "spinning") setAnimStage("idle");
                    }

                } catch (e) {
                    console.error("State Sync Error", e);
                }
            };

            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 1000);
                return () => clearInterval(interval);
            }, [animStage, isAdmin, isViewerMode]);

            // actions
            const doAction = async (action, payload = {}) => {
                try {
                    if (!isAdmin) return;

                    if (action === "SPIN") {
                        setAnimStage("spinning");

                        await fetch("/api/action/", {
                            method: "POST",
                            headers: headersJSON,
                            body: JSON.stringify({ action }),
                        });

                        setTimeout(async () => {
                            const r = await fetch("/api/state/");
                            const nd = await r.json();
                            setData(nd);
                            setTempWinner(nd.current_player);
                            setAnimStage("revealed");
                            if (nd.current_player) prevPlayerId.current = nd.current_player.id;
                        }, 1200);

                        return;
                    }

                    await fetch("/api/action/", {
                        method: "POST",
                        headers: headersJSON,
                        body: JSON.stringify({ action, ...payload }),
                    });

                    fetchData();
                } catch (e) {
                    console.error("Action Error", e);
                }
            };

            // pin verify
            const verifyAdmin = async () => {
                try {
                    const res = await fetch("/api/verify-pin/", {
                        method: "POST",
                        headers: headersJSON,
                        body: JSON.stringify({ pin: pinInput }),
                    });
                    const json = await res.json();

                    if (json.success) {
                        setIsAdmin(true);
                        setShowPin(false);
                        setPinInput("");
                    } else {
                        alert("INVALID PIN");
                        setPinInput("");
                    }
                } catch (e) {
                    alert("SERVER ERROR");
                }
            };

            // share
            const shareLink = (type) => {
                const url = `${window.location.origin}${window.location.pathname}${type === "viewer" ? "?role=viewer" : ""}`;
                const text = type === "captain"
                    ? `🧢 Join Auction (Captain): ${url}`
                    : `👀 Watch Live Auction (Viewer): ${url}`;
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
            };

            // custom bid
            const submitCustomBid = () => {
                if (!customBid) return;
                const num = parseInt(customBid);
                if (isNaN(num)) return;
                doAction("BID", { amount: num });
                setCustomBid("");
            };

            // team modal leadership
            useEffect(() => {
                if (!selectedTeam) return;
                setCaptainDraft(selectedTeam.captain_name || "");
                setViceDraft(selectedTeam.vice_captain_name || "");
            }, [selectedTeam]);

            const saveRoles = async () => {
                try {
                    if (!selectedTeam) return;

                    await fetch("/api/assign-roles/", {
                        method: "POST",
                        headers: headersJSON,
                        body: JSON.stringify({
                            team_id: selectedTeam.id,
                            captain: captainDraft,
                            vice_captain: viceDraft,
                        }),
                    });

                    fetchData();
                } catch (e) {
                    console.error("Role Save Error", e);
                }
            };

            if (!data) {
                return (
                    <div className="h-screen flex items-center justify-center bg-black font-hero text-5xl text-cyan-500 animate-pulse uppercase">
                        LOADING STADIUM...
                    </div>
                );
            }

            const {
                current_player,
                current_bid,
                teams = [],
                history = [],
                stats = {},
                auction_name,
            } = data;

            const sortedHistory = [...history].slice().reverse();
            const latestFeed = sortedHistory.slice(0, 14);
            const latestTicker = sortedHistory.slice(0, 30);

            return (
                <div className={`min-h-screen ${pageBG} transition-colors duration-700`}>
                    <div className="min-h-screen flex flex-col gap-4 p-4 md:p-5">

                        {/* ===== REVEAL ===== */}
                        {(animStage === "spinning" || animStage === "revealed") && (
                            <div
                                className="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 backdrop-blur-3xl"
                                onClick={isAdmin ? () => { setAnimStage("idle"); setTempWinner(null); } : null}
                            >
                                {animStage === "spinning" && (
                                    <div className="text-center relative">
                                        <div className="absolute inset-0 bg-cyan-500 blur-[140px] opacity-20"></div>
                                        <div className="w-64 h-64 rounded-full border-2 border-cyan-500/30 border-t-cyan-400 animate-spin mx-auto mb-10 flex items-center justify-center bg-black/40 shadow-[0_0_60px_rgba(6,182,212,0.25)]">
                                            <Trophy c="w-20 h-20 text-cyan-500/40" />
                                        </div>
                                        <h2 className="font-tech text-6xl tracking-[0.25em] animate-pulse text-white uppercase">
                                            {scrambleText}
                                        </h2>
                                        <p className="text-cyan-400 font-mono mt-4 text-xs tracking-[0.5em] opacity-70">
                                            ACCESSING DATABASE
                                        </p>
                                    </div>
                                )}

                                {animStage === "revealed" && tempWinner && (
                                    <div className="text-center animate-slam relative w-full max-w-5xl mx-auto px-4">
                                        <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[900px] h-[900px] bg-gradient-to-t from-transparent via-cyan-500/10 to-transparent rays -z-10 opacity-60"></div>

                                        <div className="relative inline-block mb-10">
                                            <div className="absolute inset-0 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-full blur-2xl opacity-50"></div>
                                            <img src={getImg(tempWinner)} className="w-64 h-64 md:w-80 md:h-80 rounded-full border-4 border-white shadow-2xl relative z-10 bg-slate-900 object-cover" />
                                            <div className="absolute -bottom-5 left-1/2 -translate-x-1/2 bg-yellow-400 text-black px-8 py-2 font-black font-hero text-2xl md:text-3xl uppercase -skew-x-12 border-2 border-white shadow-[0_10px_20px_rgba(0,0,0,0.5)] z-20 whitespace-nowrap">
                                                {tempWinner.category}
                                            </div>
                                        </div>

                                        <h1 className="font-hero text-7xl md:text-9xl text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400 drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)] leading-[0.8] mb-4 uppercase">
                                            {tempWinner.name}
                                        </h1>

                                        <div className="flex flex-wrap justify-center gap-4 mb-10">
                                            <span className="font-tech text-xl md:text-2xl text-cyan-400 tracking-[0.3em] uppercase border border-cyan-500/30 px-4 py-1 rounded bg-cyan-950/30">
                                                {tempWinner.position}
                                            </span>
                                        </div>

                                        {isAdmin ? (
                                            <button
                                                onClick={(e) => { e.stopPropagation(); setAnimStage("idle"); setTempWinner(null); }}
                                                className="px-16 py-5 bg-white text-black font-black text-2xl tracking-widest rounded-full hover:scale-105 hover:shadow-[0_0_40px_rgba(255,255,255,0.4)] transition active:scale-95 uppercase"
                                            >
                                                OPEN BIDDING
                                            </button>
                                        ) : (
                                            <p className="text-white/50 animate-pulse font-mono uppercase tracking-widest">
                                                Waiting for Auctioneer...
                                            </p>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ===== NAVBAR ===== */}
                        <header className={`${glass} rounded-3xl px-6 py-4 flex flex-col xl:flex-row items-center gap-4 sticky top-3 z-50`}>

                            {/* LEFT BRAND */}
                            <div className="flex items-center justify-between w-full xl:w-auto gap-4">
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-xl shadow-cyan-500/20">
                                        <Trophy c="text-white w-7 h-7" />
                                    </div>

                                    <div>
                                        <h1 className={`font-hero text-4xl leading-none uppercase tracking-tight ${isDark ? "text-white" : "text-slate-900"}`}>
                                            {auction_name}
                                        </h1>

                                        <div className="flex items-center gap-3 mt-1">
                                            <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>

                                            <span className="text-[10px] font-black tracking-[0.25em] uppercase text-cyan-500">
                                                LIVE
                                            </span>

                                            <span className="text-[10px] font-black tracking-[0.25em] uppercase opacity-60">
                                                Remaining: {stats.remaining || 0}
                                            </span>

                                            <span className="text-[10px] font-black tracking-[0.25em] uppercase opacity-60">
                                                Unsold: {stats.unsold || 0}
                                            </span>

                                            <span className="text-[10px] font-black tracking-[0.25em] uppercase opacity-60">
                                                {isViewerMode ? "VIEWER MODE" : (isAdmin ? "ADMIN" : "CONSOLE")}
                                            </span>
                                            {isAdmin && (
                                                <button
                                                    onClick={() => setShowCheat(true)}
                                                    className="px-5 py-2 text-xs font-black rounded-xl border border-fuchsia-500 text-fuchsia-400 hover:bg-fuchsia-500/10 uppercase tracking-widest transition hover:scale-105"
                                                >
                                                    Remaining Player 
                                                </button>
                                            )}

                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* TICKER */}
                            <div className="w-full xl:flex-1 xl:px-10">
                                <div className={`h-10 rounded-full border flex items-center overflow-hidden relative ${isDark ? "bg-black/40 border-white/5" : "bg-white border-slate-200"
                                    }`}>
                                    <div className="whitespace-nowrap animate-scroll absolute text-[11px] font-bold tracking-wider text-cyan-500 flex gap-16 uppercase italic">
                                        {latestTicker.length > 0 ? latestTicker.map((h, i) => (
                                            <span key={i}>
                                                <span className={isDark ? "text-white" : "text-slate-900"}>{h.player_name}</span> SOLD TO{" "}
                                                <span className="text-emerald-500">{h.team_name}</span>{" "}
                                                FOR <span className="text-yellow-500">${h.amount}</span>
                                            </span>
                                        )) : <span>WAITING FOR FIRST SALE...</span>}
                                    </div>
                                </div>
                            </div>

                            {/* ACTIONS */}
                            <div className="flex gap-2 items-center">

                                {/* Theme */}
                                <button
                                    onClick={() => setTheme(isDark ? "light" : "dark")}
                                    className={`px-3 py-2 rounded-xl border hover:scale-105 transition ${isDark ? "border-white/10 text-white/80" : "border-slate-200 text-slate-700"
                                        }`}
                                    title="Day/Night"
                                >
                                    {isDark ? <Sun c="w-5 h-5" /> : <Moon c="w-5 h-5" />}
                                </button>

                                {/* Share + Export (Admin only) */}
                                {isAdmin && (
                                    <>
                                        <button
                                            onClick={() => setShowShare(true)}
                                            className={`px-3 py-2 rounded-xl border hover:scale-105 transition ${isDark ? "border-white/10" : "border-slate-200"
                                                }`}
                                            title="Share"

                                    <h3 className="font-hero text-4xl my-6 uppercase">Verify Admin</h3>

                                    <input
                                        type="password"
                                        maxLength="6"
                                        value={pinInput}
                                        onChange={e => setPinInput(e.target.value)}
                                        className="w-full bg-black/50 border border-white/10 rounded-2xl py-5 text-center text-4xl tracking-[0.5em] mb-8 outline-none focus:border-cyan-500 text-cyan-500 font-tech"
                                        autoFocus
                                    />

                                    <button onClick={verifyAdmin} className="w-full py-4 btn-main rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg shadow-cyan-500/20 text-white">
                                        AUTHORIZE TERMINAL
                                    </button>

                                    <button onClick={() => setShowPin(false)} className="mt-6 text-[10px] font-bold opacity-30 uppercase hover:opacity-100 transition-all">
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
